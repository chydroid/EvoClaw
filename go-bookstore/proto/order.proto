syntax = "proto3";

package order;

option go_package = "./proto/order";

// 订单服务定义
service OrderService {
  // 创建订单
  rpc CreateOrder(CreateOrderRequest) returns (OrderMessage);
  // 获取订单详情
  rpc GetOrder(GetOrderRequest) returns (OrderMessage);
  // 获取用户订单列表
  rpc ListUserOrders(ListUserOrdersRequest) returns (ListUserOrdersResponse);
}

// 创建订单请求
message CreateOrderRequest {
  int64 user_id = 1;
  repeated OrderItem items = 2;
}

// 订单项
message OrderItem {
  int64 product_id = 1;
  int32 quantity = 2;
  double price = 3;
}

// 获取订单详情请求
message GetOrderRequest {
  int64 id = 1;
}

// 获取用户订单列表请求
message ListUserOrdersRequest {
  int64 user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

// 订单列表响应
message ListUserOrdersResponse {
  repeated OrderMessage orders = 1;
  int32 total = 2;
}

// 订单信息
message OrderMessage {
  int64 id = 1;
  int64 user_id = 2;
  repeated OrderItem items = 3;
  double total_amount = 4;
  string status = 5;
  string created_at = 6;
}

syntax = "proto3";

package user;

option go_package = "./proto/user";

// 用户服务定义
service UserService {
  // 用户注册
  rpc Register(RegisterRequest) returns (UserResponse);
  // 用户登录
  rpc Login(LoginRequest) returns (LoginResponse);
  // 获取用户信息
  rpc GetUser(GetUserRequest) returns (UserResponse);
}

// 注册请求
message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
}

// 登录请求
message LoginRequest {
  string username = 1;
  string password = 2;
}

// 登录响应
message LoginResponse {
  int64 user_id = 1;
  string username = 2;
  string token = 3;
}

// 获取用户请求
message GetUserRequest {
  int64 id = 1;
}

// 用户响应
message UserResponse {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string created_at = 4;
}

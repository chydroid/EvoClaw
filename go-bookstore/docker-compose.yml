version: '3.8'

services:
  # ========== 数据库 ==========
  mysql-user:
    image: mysql:8.0
    container_name: mysql-user
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: bookstore_user
    ports:
      - "3306:3306"
    volumes:
      - mysql-user-data:/var/lib/mysql
    networks:
      - bookstore-net

  mysql-product:
    image: mysql:8.0
    container_name: mysql-product
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: bookstore_product
    ports:
      - "3307:3306"
    volumes:
      - mysql-product-data:/var/lib/mysql
    networks:
      - bookstore-net

  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: bookstore_order
    ports:
      - "3308:3306"
    volumes:
      - mysql-order-data:/var/lib/mysql
    networks:
      - bookstore-net

  # ========== 微服务 ==========
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user
    container_name: user-service
    ports:
      - "50051:50051"
    depends_on:
      - mysql-user
    networks:
      - bookstore-net

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.product
    container_name: product-service
    ports:
      - "50052:50052"
    depends_on:
      - mysql-product
    networks:
      - bookstore-net

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.order
    container_name: order-service
    ports:
      - "50053:50053"
    depends_on:
      - mysql-order
    networks:
      - bookstore-net

  # ========== 网关 ==========
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - bookstore-net

volumes:
  mysql-user-data:
  mysql-product-data:
  mysql-order-data:

networks:
  bookstore-net:
    driver: bridge

# ─── EvoClaw stable release pipeline（P3-6 设计 §四，对标 Hermes stable release pipeline）───
#
# one attempt ref：每次发布 = 一次 `git tag vX.Y.Z`。
#   阶段 A（release-test）：构建测试镜像 vX.Y.Z-test.<sha> → 容器 /health 冒烟；
#   阶段 B（release-stable）：A 全绿后构建并推 stable 镜像 vX.Y.Z + latest，
#   写 receipt（logs/release/receipt-vX.Y.Z.json，仿 curator-report 不可变快照模式）
#   并上传为 GitHub Release asset。
# 任一阶段失败即停止，不打 stable 镜像；同 tag 只允许一次 attempt，重试请递增 patch 号重打 tag。
#
# 本地阶段（bump + changelog 校验）已落地：pnpm release:prepare（scripts/release-prepare.mjs）。
# 本 workflow 纯新增，不触碰 ci.yml 的 lint/test/build/docker job（回退 = 删本文件）。

name: EvoClaw Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write    # gh release 创建/上传 receipt asset
  packages: write    # ghcr.io 镜像推送

env:
  NODE_VERSION: "24"

jobs:
  # ── 阶段 A：测试镜像 + 冒烟 ────────────────────────────
  release-test:
    name: Test Image & Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Configure Docker daemon with registry mirrors
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors":["https://mirror.gcr.io","https://dockerhub.timeweb.cloud"],"max-concurrent-downloads":10}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push test image
        id: build-test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # one attempt ref：tag + commit sha 共同标识本次发布尝试
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-test.${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=evoclaw-release-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke — 容器 /health
        env:
          TAG_VERSION: ${{ github.ref_name }}
          CI_SHA: ${{ github.sha }}
          CI_REPO: ${{ github.repository }}
        run: |
          set -e
          TEST_IMAGE="ghcr.io/${CI_REPO}:${TAG_VERSION}-test.${CI_SHA}"
          docker pull "$TEST_IMAGE"
          docker run -d --name evoclaw-smoke -p 27788:27788 "$TEST_IMAGE"
          # 镜像 HEALTHCHECK start-period=30s，给 120s 轮询窗口
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:27788/health" > /tmp/health.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs evoclaw-smoke > /tmp/smoke-logs.txt 2>&1 || true
          if [ "$ok" != "1" ]; then
            echo "✗ /health 未在 120s 内就绪，smoke logs："
            tail -50 /tmp/smoke-logs.txt
            exit 1
          fi
          echo "✓ /health 响应："
          cat /tmp/health.json
          docker rm -f evoclaw-smoke
      - name: 记录测试镜像 digest（供阶段 B 写入 receipt）
        id: record-digest
        run: |
          mkdir -p logs/release
          echo "${{ steps.build-test.outputs.digest }}" > "logs/release/digest-${{ github.ref_name }}.txt"
          echo "test image digest: ${{ steps.build-test.outputs.digest }}"
      - name: Upload test image digest
        uses: actions/upload-artifact@v4
        with:
          name: release-test-digest
          path: logs/release/digest-${{ github.ref_name }}.txt

  # ── 阶段 B：stable 镜像 + receipt + release asset ─────
  release-stable:
    name: Stable Image & Receipt
    runs-on: ubuntu-latest
    needs: [release-test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Configure Docker daemon with registry mirrors
        run: |
          sudo mkdir -p /etc/docker
          echo '{"registry-mirrors":["https://mirror.gcr.io","https://dockerhub.timeweb.cloud"],"max-concurrent-downloads":10}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker || true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1
            network=host
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push stable image
        id: build-stable
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=evoclaw
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Download test image digest
        id: download-digest
        uses: actions/download-artifact@v4
        with:
          name: release-test-digest
          path: logs/release/
      - name: 写 receipt（不可变快照，仿 curator-report run.json 模式）
        env:
          TAG_VERSION: ${{ github.ref_name }}
          CI_SHA: ${{ github.sha }}
          CI_REPO: ${{ github.repository }}
          STABLE_DIGEST: ${{ steps.build-stable.outputs.digest }}
          TEST_DIGEST_FILE: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p logs/release
          TEST_DIGEST="$(cat "logs/release/digest-${TEST_DIGEST_FILE}.txt" 2>/dev/null || echo unknown)"
          export TEST_DIGEST
          node -e '
            const fs = require("fs");
            const receipt = {
              attemptRef: process.env.TAG_VERSION,
              commitSha: process.env.CI_SHA,
              version: process.env.TAG_VERSION,
              stableImage: "ghcr.io/" + process.env.CI_REPO + ":" + process.env.TAG_VERSION,
              stableDigest: process.env.STABLE_DIGEST,
              testImage: "ghcr.io/" + process.env.CI_REPO + ":" + process.env.TAG_VERSION + "-test." + process.env.CI_SHA,
              testDigest: process.env.TEST_DIGEST,
              testResults: { health: "pass" },
              publishedAt: new Date().toISOString(),
              policy: "one-attempt: 同 tag 只允许一次 attempt，重试请递增 patch 号重打 tag",
            };
            const receiptPath = "logs/release/receipt-" + process.env.TAG_VERSION + ".json";
            fs.writeFileSync(receiptPath, JSON.stringify(receipt, null, 2) + "\n");
            console.log("✓ receipt 已写入 " + receiptPath);
          '
      - name: Upload receipt as GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VERSION: ${{ github.ref_name }}
          CI_REPO: ${{ github.repository }}
        run: |
          set -e
          RECEIPT="logs/release/receipt-${TAG_VERSION}.json"
          # tag 触发时 GitHub 已自动创建 release（若存在则 edit，否则 create）
          gh release edit "${TAG_VERSION}" \
            --title "EvoClaw ${TAG_VERSION}" \
            --repo "${CI_REPO}" \
            || gh release create "${TAG_VERSION}" \
              --title "EvoClaw ${TAG_VERSION}" \
              --notes "stable release：测试镜像冒烟通过 → stable 镜像 + latest。receipt 见 release asset。" \
              --repo "${CI_REPO}"
          gh release upload "${TAG_VERSION}" "${RECEIPT}" --repo "${CI_REPO}" --clobber
      - name: Upload receipt artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt
          path: logs/release/receipt-${{ github.ref_name }}.json

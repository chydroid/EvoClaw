# EvoClaw Docker Compose
# Usage: docker-compose up -d

version: "3.9"

services:
  evoclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evoclaw-gateway
    ports:
      - "${EvoClaw_PORT:-17788}:17788"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - evoclaw-data:/app/data
      - evoclaw-logs:/app/logs
      # Mount skills for development
      - ./data/workspace/skills:/app/data/workspace/skills:ro
      # Mount bootstrap files
      - ./data/workspace:/app/data/workspace:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://localhost:'+(process.env.EvoClaw_PORT||17788)+'/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - evoclaw-net

volumes:
  evoclaw-data:
    driver: local
  evoclaw-logs:
    driver: local

networks:
  evoclaw-net:
    driver: bridge
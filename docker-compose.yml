services:
  evoclaw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evoclaw
    ports:
      - "${EvoClaw_PORT:-27788}:27788"
    volumes:
      - evoclaw-data:/app/data
      - evoclaw-logs:/app/logs
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - EvoClaw_HOST=0.0.0.0
      - EvoClaw_PORT=27788
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "const http=require('http');http.get('http://localhost:27788/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  evoclaw-data:
    driver: local
  evoclaw-logs:
    driver: local
